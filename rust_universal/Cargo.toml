[package]
name = "rust_universal"
version = "0.1.0"
edition = "2021"
description = "Compilateur DSL .run pour applications web"

[lib]
name = "rust_universal"
path = "src/lib.rs"

[[bin]]
name = "rust_universal"
path = "src/main.rs"

[dependencies]
ron = "0.8"        # Pour la sérialisation/désérialisation en format RON
serde = { version = "1.0", features = ["derive"] } # Pour les traits Serialize/Deserialize
bincode = "1.3"    # Pour la sérialisation/désérialisation binaire efficace
