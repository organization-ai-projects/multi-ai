[package]
name = "ai_observer"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }  # Pour la sérialisation
serde_json = "1.0"      # Pour stocker et charger le graphe en JSON
chrono = { version = "0.4", features = ["serde"] }  # Pour horodater les expositions
rand = "0.8"            # Pour d'éventuelles fonctionnalités probabilistes
ron = "0.8"             # Format Rusty Object Notation
bincode = "1.3"         # Format binaire pour la sérialisation
