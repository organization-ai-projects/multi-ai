[package]
name = "evolve_system"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ron = "0.8"
rand = "0.8"
bincode = "1.3"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
scraper = "0.13"
uuid = { version = "1", features = ["v4"] }
syn = { version = "1.0", features = ["full"] }
