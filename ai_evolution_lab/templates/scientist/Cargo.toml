[package]
name = "scientist_ai"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ron = "0.8"
rand = { version = "0.8", features = ["std"] }
chrono = "0.4"
uuid = { version = "1.4", features = ["v7", "serde"] }
log = "0.4"
env_logger = "0.9"
ctrlc = "3.2"
