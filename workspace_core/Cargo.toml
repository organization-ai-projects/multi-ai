[package]
name = "workspace_core"
version = "0.1.0"
edition = "2024"

[dependencies]
ron = "0.8"
serde = { version = "1.0", features = ["derive"] }
toml = "0.5"
clap = { version = "4.0", features = ["derive"] }
uuid = { version = "1.6", features = ["v7", "serde"] }
bincode = "1.3"
thiserror = "1.0"
parking_lot = "0.12"
lru = "0.12"
metrics = "0.21"
tokio = { version = "1.0", features = ["full"] }
serde_json = "1.0"
