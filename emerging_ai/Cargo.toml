[package]
name = "emerging_ai"
version = "0.1.0"
edition = "2024"

[dependencies]
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
petgraph = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ron = "0.8"
bincode = "1.3"
walkdir = "2.3"
uuid = { version = "1.7", features = ["v7", "serde", "std"] }  # v7 pour UUIDv7 avec ordre temporel
ctrlc = "3.4"
signal-hook = "0.3"
sysinfo = "0.29"
chrono = "0.4"  # Pour les timestamps
